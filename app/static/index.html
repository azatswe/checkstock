<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CheckStock — остатки</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fa; }
      body { margin: 0; }
      main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
      h1 { margin: 0; font-size: 1.7rem; }
      .subtitle { margin: 8px 0 24px; color: #596579; }
      .table-wrap { overflow-x: auto; background: #fff; border: 1px solid #dce2eb; border-radius: 10px; }
      table { width: 100%; min-width: 680px; border-collapse: collapse; text-align: left; }
      th, td { padding: 13px 16px; border-bottom: 1px solid #e8ecf2; }
      th { background: #f9fafc; color: #596579; font-size: .9rem; font-weight: 600; }
      tbody tr:last-child td { border-bottom: 0; }
      td.number { text-align: right; font-variant-numeric: tabular-nums; }
      #status { min-height: 24px; margin: 0 0 12px; color: #596579; }
      #status.error { color: #a12626; }
      @media (max-width: 600px) { main { padding: 24px 12px; } th, td { padding: 11px 12px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>CheckStock</h1>
      <p class="subtitle">Остатки по товарам и складам фулфилмента</p>
      <p id="status" role="status" aria-live="polite">Загружаем остатки…</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Артикул</th>
              <th scope="col">Товар</th>
              <th scope="col">ФФ</th>
              <th scope="col">Физически</th>
              <th scope="col">Резерв FBS</th>
              <th scope="col">Доступно</th>
            </tr>
          </thead>
          <tbody id="stock-rows"></tbody>
        </table>
      </div>
    </main>
    <script>
      const status = document.querySelector("#status");
      const rows = document.querySelector("#stock-rows");

      function addCell(row, value, numeric = false) {
        const cell = document.createElement("td");
        cell.textContent = value;
        if (numeric) cell.className = "number";
        row.append(cell);
      }

      async function loadStock() {
        try {
          const response = await fetch("/api/stock", { headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error("stock request failed");
          const data = await response.json();
          rows.replaceChildren();

          for (const item of data.items) {
            const row = document.createElement("tr");
            addCell(row, item.sku);
            addCell(row, item.product_name);
            addCell(row, item.warehouse_name);
            addCell(row, String(item.physical_quantity), true);
            addCell(row, String(item.fbs_reserved), true);
            addCell(row, String(item.available), true);
            rows.append(row);
          }

          status.textContent = data.items.length ? `Позиций: ${data.items.length}` : "Пока нет товаров. Загрузите тестовые данные.";
          status.classList.remove("error");
        } catch {
          status.textContent = "Не удалось загрузить остатки. Проверьте PostgreSQL и начальные данные.";
          status.classList.add("error");
        }
      }

      loadStock();
    </script>
  </body>
</html>
